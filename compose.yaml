services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: evaltrace
      POSTGRES_DB: evaltrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaltrace"]
      interval: 5s
      retries: 12
    mem_limit: 512m
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://evaltrace:${POSTGRES_PASSWORD}@db:5432/evaltrace
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
    ports: ["127.0.0.1:8002:8000"]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m
volumes:
  db:
