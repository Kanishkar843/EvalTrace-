services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: evaltrace
      POSTGRES_DB: evaltrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaltrace"]
      interval: 5s
      retries: 12
    mem_limit: 512m
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://evaltrace:${POSTGRES_PASSWORD}@db:5432/evaltrace
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
    ports: ["127.0.0.1:${APP_PORT:-8002}:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      retries: 6
    mem_limit: 512m
  worker:
    profiles: [worker]
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://evaltrace:${POSTGRES_PASSWORD}@db:5432/evaltrace
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 384m
volumes:
  db:
